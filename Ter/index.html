<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Web Game Port</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: Arial, sans-serif;
    }
    #progress-container {
      text-align: center;
    }
    #bar {
      width: 300px;
      height: 20px;
      background: #333;
      margin-top: 10px;
      border-radius: 5px;
      overflow: hidden;
    }
    #fill {
      height: 100%;
      width: 0%;
      background: lime;
      transition: width 0.2s;
    }
    #percent {
      margin-top: 10px;
      font-size: 18px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="progress-container">
    <h1>Loading Game...</h1>
    <div id="bar"><div id="fill"></div></div>
    <p id="percent">0%</p>
  </div>

  <!-- JS-DOS library -->
  <script src="https://cdn.jsdelivr.net/npm/js-dos@7.4.1/dist/js-dos.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@7.4.1/dist/js-dos.css" />

  <script>
    // ✅ Proxy added here
    const gameUrl = "https://cors.isomorphic-git.org/https://archive.org/download/game_20251020_202510/game.zip";
    const percentEl = document.getElementById("percent");
    const fillEl = document.getElementById("fill");

    Dos(document.body).run(gameUrl, {
      onprogress: (stage, total, loaded) => {
        if (total > 0) {
          const percent = Math.floor((loaded / total) * 100);
          fillEl.style.width = percent + "%";
          percentEl.textContent = percent + "%";
        }
      }
    }).then((ci) => {
      document.getElementById("progress-container").remove();
      ci.fullscreen();
    });
  </script>
</body>
</html>
