<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Mortal Kombat 3 (SNES Web Port)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    #screen {
      image-rendering: pixelated;
      width: 640px;
      height: 480px;
      margin-top: 20px;
      border: 2px solid #444;
    }
    #loading {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Ultimate Mortal Kombat 3 (SNES)</h1>
  <canvas id="screen" width="256" height="224"></canvas>
  <div id="loading">Loading ROM...</div>

  <script src="https://cdn.jsdelivr.net/gh/bfirsh/jsnes/dist/jsnes.min.js"></script>
  <script>
    const canvas = document.getElementById("screen");
    const ctx = canvas.getContext("2d");
    const loading = document.getElementById("loading");

    // Create emulator
    const nes = new jsnes.NES({
      onFrame(frameBuffer) {
        const imageData = ctx.getImageData(0, 0, 256, 224);
        for (let i = 0; i < frameBuffer.length; i++) {
          imageData.data[i] = frameBuffer[i];
        }
        ctx.putImageData(imageData, 0, 0);
      },
      onAudioSample() {}
    });

    fetch("Ultimate Mortal Kombat 3 (USA).sfc")
      .then(res => res.arrayBuffer())
      .then(buffer => {
        loading.textContent = "ROM loaded! Starting...";
        nes.loadROM(new Uint8Array(buffer));
        setInterval(() => nes.frame(), 1000 / 60);
        loading.remove();
      })
      .catch(err => {
        console.error(err);
        loading.textContent = "Error loading ROM file. Make sure it's in the same folder as this HTML.";
      });
  </script>
</body>
</html>
