<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Mortal Kombat 3 (SNES)</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      text-align: center;
      font-family: sans-serif;
    }
    canvas {
      image-rendering: pixelated;
      margin-top: 10px;
      background: #000;
      width: 640px;
      height: 480px;
    }
    button {
      padding: 8px 16px;
      margin: 10px;
      font-size: 16px;
      background: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #555; }
  </style>
</head>
<body>
  <h1>Ultimate Mortal Kombat 3 (SNES)</h1>
  <canvas id="screen"></canvas>
  <div>
    <button id="fullscreen">Fullscreen</button>
  </div>

  <!-- JSNES Emulator -->
  <script src="https://cdn.jsdelivr.net/npm/jsnes@0.8.0/dist/jsnes.min.js"></script>
  <script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const nes = new jsnes.NES({
      onFrame: function(frameBuffer) {
        const imageData = ctx.getImageData(0, 0, 256, 240);
        for (let i = 0; i < frameBuffer.length; i++) {
          imageData.data[i] = frameBuffer[i];
        }
        ctx.putImageData(imageData, 0, 0);
      }
    });

    // Load ROM file
    fetch('Ultimate Mortal Kombat 3 (USA).sfc')
      .then(res => res.arrayBuffer())
      .then(data => {
        nes.loadROM(data);
        function frame() {
          nes.frame();
          requestAnimationFrame(frame);
        }
        frame();
      })
      .catch(err => {
        document.body.innerHTML = "<h2>Could not load the ROM file.</h2>";
        console.error(err);
      });

    document.getElementById('fullscreen').onclick = () => {
      if (canvas.requestFullscreen) canvas.requestFullscreen();
    };
  </script>
</body>
</html>
