<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Mortal Kombat 3 (SNES)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: Arial, sans-serif;
    }
    canvas {
      image-rendering: pixelated;
      width: 640px;
      height: 480px;
      background: #000;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #666; }
  </style>
</head>
<body>
  <h1>Ultimate Mortal Kombat 3 (SNES)</h1>
  <canvas id="screen"></canvas>
  <button id="fullscreen">Fullscreen</button>

  <script src="https://unpkg.com/snes9x-wasm/dist/snes9xwasm.min.js"></script>
  <script>
    const canvas = document.getElementById('screen');
    const button = document.getElementById('fullscreen');

    fetch('Ultimate Mortal Kombat 3 (USA).sfc')
      .then(res => res.arrayBuffer())
      .then(data => {
        const emulator = new Snes9xWasm({ canvas });
        emulator.loadRom(new Uint8Array(data));
        emulator.run();
      })
      .catch(err => {
        document.body.innerHTML = "<h2>Couldn't load the ROM file. Make sure it's in the same folder as this HTML.</h2>";
        console.error(err);
      });

    button.onclick = () => {
      if (canvas.requestFullscreen) canvas.requestFullscreen();
    };
  </script>
</body>
</html>
