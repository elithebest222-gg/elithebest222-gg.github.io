<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bible Reader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 1rem;
      background: #f0f0f0;
    }
    main {
      padding: 1rem;
      max-width: 800px;
      margin: 0 auto;
    }
    select {
      padding: 0.5rem;
      margin: 0.5rem;
      font-size: 1rem;
    }
    #verses {
      margin-top: 1rem;
      line-height: 1.6;
    }
    footer {
      text-align: center;
      padding: 1rem;
      background: #f0f0f0;
      margin-top: 2rem;
    }
    footer a {
      text-decoration: none;
      color: #0000ee;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bible Reader</h1>
    <div>
      <select id="bookSelect"></select>
      <select id="chapterSelect"></select>
    </div>
  </header>
  <main>
    <div id="verses">Loading...</div>
  </main>
  <footer>
    <a href="https://sites.google.com/newtonstudents.org/nextgen/home" target="_blank">Made by GN-MATH</a>
  </footer>

  <script>
    const books = {
      "Genesis": 50, "Exodus": 40, "Leviticus": 27, "Numbers": 36, "Deuteronomy": 34,
      "Joshua": 24, "Judges": 21, "Ruth": 4, "1 Samuel": 31, "2 Samuel": 24,
      "1 Kings": 22, "2 Kings": 25, "1 Chronicles": 29, "2 Chronicles": 36,
      "Ezra": 10, "Nehemiah": 13, "Esther": 10, "Job": 42, "Psalms": 150,
      "Proverbs": 31, "Ecclesiastes": 12, "Song of Solomon": 8, "Isaiah": 66,
      "Jeremiah": 52, "Lamentations": 5, "Ezekiel": 48, "Daniel": 12, "Hosea": 14,
      "Joel": 3, "Amos": 9, "Obadiah": 1, "Jonah": 4, "Micah": 7, "Nahum": 3,
      "Habakkuk": 3, "Zephaniah": 3, "Haggai": 2, "Zechariah": 14, "Malachi": 4,
      "Matthew": 28, "Mark": 16, "Luke": 24, "John": 21, "Acts": 28, "Romans": 16,
      "1 Corinthians": 16, "2 Corinthians": 13, "Galatians": 6, "Ephesians": 6,
      "Philippians": 4, "Colossians": 4, "1 Thessalonians": 5, "2 Thessalonians": 3,
      "1 Timothy": 6, "2 Timothy": 4, "Titus": 3, "Philemon": 1, "Hebrews": 13,
      "James": 5, "1 Peter": 5, "2 Peter": 3, "1 John": 5, "2 John": 1,
      "3 John": 1, "Jude": 1, "Revelation": 22
    };

    const bookSelect = document.getElementById('bookSelect');
    const chapterSelect = document.getElementById('chapterSelect');
    const versesDiv = document.getElementById('verses');

    Object.keys(books).forEach(book => {
      const option = document.createElement('option');
      option.value = book;
      option.textContent = book;
      bookSelect.appendChild(option);
    });

    bookSelect.addEventListener('change', () => {
      chapterSelect.innerHTML = '';
      const chapterCount = books[bookSelect.value];
      for (let i = 1; i <= chapterCount; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = i;
        chapterSelect.appendChild(option);
      }
      loadChapter();
    });

    chapterSelect.addEventListener('change', loadChapter);

    function loadChapter() {
      const book = bookSelect.value;
      const chapter = chapterSelect.value;
      versesDiv.innerHTML = 'Loading...';
      fetch(`https://bible-api.com/${encodeURIComponent(book)}%20${chapter}`)
        .then(response => response.json())
        .then(data => {
          versesDiv.innerHTML = '';
          data.verses.forEach(v => {
            const p = document.createElement('p');
            p.textContent = `${v.verse}: ${v.text.trim()}`;
            versesDiv.appendChild(p);
          });
        })
        .catch(err => {
          versesDiv.innerHTML = 'Error loading chapter.';
          console.error(err);
        });
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      bookSelect.value = "Genesis";
      bookSelect.dispatchEvent(new Event('change'));
    });
  </script>
</body>
</html>
