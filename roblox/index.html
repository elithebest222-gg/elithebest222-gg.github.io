<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roblox</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Popup styling */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      color: #00ff99;
      padding: 20px 40px;
      border-radius: 12px;
      font-size: 20px;
      text-align: center;
      z-index: 9999;
      box-shadow: 0 0 25px #00ff99;
      animation: fadeOut 1s ease-in-out 4s forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>
</head>
<body>
  <!-- Popup -->
  <div class="popup" id="popup">Made by GN-MATH x Froggie Team</div>

  <!-- Embedded Roblox page -->
  <iframe 
    src="https://75.ip.nowgg.fun/apps/a/19900/b.html"
    title="Roblox"
    allowfullscreen
    sandbox="allow-scripts allow-forms allow-popups allow-modals">
  </iframe>
</body>
</html>
