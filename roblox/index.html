<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roblox by GN-MATH</title>
  <style>
    :root{--bg:#0b1020;--card:#0f1724;--accent:#06f;--glass: rgba(255,255,255,0.04)}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    body{background:linear-gradient(180deg,#020217 0%, #07102a 100%);color:#e6eef8;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;gap:.75rem;padding:10px 16px;background:rgba(0,0,0,0.12);backdrop-filter:blur(6px)}
    .brand{font-weight:700;font-size:1rem;letter-spacing:.6px}
    .actions{margin-left:auto;display:flex;gap:.5rem}
    button{background:var(--glass);border:1px solid rgba(255,255,255,0.04);padding:.45rem .7rem;border-radius:10px;color:inherit;cursor:pointer}
    button:hover{opacity:.95}
    .frame-wrap{flex:1;display:flex;align-items:stretch;padding:12px}
    iframe{flex:1;border-radius:12px;border:0;box-shadow:0 6px 30px rgba(2,6,23,0.7);min-height:300px}
    .notice{padding:12px;text-align:center;font-size:.95rem;color:#cfe6ff}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Roblox by GN-MATH</div>
    <div class="actions">
      <button id="open-blank">ABOUT:BLANK</button>
    </div>
  </div>

  <div class="frame-wrap" id="frameWrap">
    <iframe id="embedFrame" src="https://math4kidz.wiki/embed.html#https://75.ip.nowgg.fun/apps/a/19900/b.html" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>

  <div class="notice">
    If the game doesn't load, try refreshing the page or disable blockers.
  </div>

  <script>
    alert('This was made by GN-MATH and if a bug, go to the chatroom and post ur bug');

    document.getElementById('open-blank').addEventListener('click', () => {
      const html = document.documentElement.outerHTML;
      const newWin = window.open('about:blank');
      newWin.document.open();
      newWin.document.write(html);
      newWin.document.close();
    });
  </script>
</body>
</html>
