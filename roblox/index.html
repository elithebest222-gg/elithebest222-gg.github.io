<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roblox - GN-MATH</title>
  <style>
    :root{--bg:#0b1020;--accent:#06f;--glass: rgba(255,255,255,0.04)}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    body{background:linear-gradient(180deg,#020217 0%, #07102a 100%);color:#e6eef8;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;gap:.75rem;padding:10px 16px;background:rgba(0,0,0,0.12);backdrop-filter:blur(6px)}
    .brand{font-weight:700;font-size:1rem;letter-spacing:.6px}
    .actions{margin-left:auto;display:flex;gap:.5rem}
    button{background:var(--glass);border:1px solid rgba(255,255,255,0.06);padding:.45rem .8rem;border-radius:10px;color:inherit;cursor:pointer;transition:0.2s}
    button:hover{opacity:.9;transform:scale(1.03)}
    iframe{flex:1;border:0;border-radius:12px;margin:12px;box-shadow:0 6px 30px rgba(2,6,23,0.7)}
    .notice{padding:12px;text-align:center;font-size:.95rem;color:#cfe6ff}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Roblox - GN-MATH</div>
    <div class="actions">
      <button id="open-direct">Direct Link</button>
      <button id="open-blank">ABOUT:BLANK</button>
    </div>
  </div>

  <iframe id="embedFrame" src="https://snoopy.mreasandiego.com/gamefile/nowgg/roblox.html" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

  <div class="notice">
    If the embed doesn’t load, try using the “Direct Link” button.
  </div>

  <script>
    alert("This was made by GN-MATH. If a bug appears, please report it in the chatroom.");

    const frame = document.getElementById('embedFrame');

    document.getElementById('open-direct').addEventListener('click', () => {
      window.open("https://snoopy.mreasandiego.com/gamefile/nowgg/roblox.html", "_blank");
    });

    document.getElementById('open-blank').addEventListener('click', () => {
      const html = document.documentElement.outerHTML;
      const newWin = window.open('about:blank');
      newWin.document.open();
      newWin.document.write(html);
      newWin.document.close();
    });
  </script>
</body>
</html>
