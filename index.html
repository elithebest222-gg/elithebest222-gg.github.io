  <section id="repos-section" aria-labelledby="repos-heading">
    <h2 id="repos-heading">🔗 All Repositories from elithebest222-gg</h2>
    <p style="margin-top:0; margin-bottom:8px; color: #444;">
      Links below are fetched live from the GitHub API.
    </p>

  <script>
    (function fetchAndRenderRepos() {
      const username = 'elithebest222-gg';
      const apiUrl = `https://api.github.com/users/${username}/repos?per_page=100&sort=updated`;

      function el(tag, props = {}, ...children) {
        const n = document.createElement(tag);
        Object.entries(props).forEach(([k, v]) => {
          if (k === 'class') n.className = v;
          else if (k === 'html') n.innerHTML = v;
          else n.setAttribute(k, v);
        });
        children.flat().forEach(c => {
          if (typeof c === 'string') n.appendChild(document.createTextNode(c));
          else if (c) n.appendChild(c);
        });
        return n;
      }

      fetch(apiUrl)
        .then(r => r.json())
        .then(repos => {
          const list = document.getElementById('repo-list');
          if (!Array.isArray(repos) || repos.length === 0) {
            list.appendChild(el('li', {}, 'No repositories found.'));
            return;
          }

          repos.forEach(repo => {
            const li = el('li');
            const nameLink = el('a', { href: repo.html_url, target: '_blank', rel: 'noopener' }, repo.name);
            const linksDiv = el('div', { class: 'repo-links' }, nameLink);

            if (repo.has_pages) {
              const homepageUrl = repo.homepage && repo.homepage.trim() !== ''
                ? repo.homepage
                : `https://${username}.github.io/${repo.name}/`;
              const pagesLink = el('a', { href: homepageUrl, target: '_blank', rel: 'noopener' }, 'Pages');
              linksDiv.appendChild(pagesLink);
            }

            const meta = el('div', { class: 'repo-meta' },
              repo.description || 'No description',
              ' • ★ ' + repo.stargazers_count,
              ' • ',
              repo.language || '—'
            );

            li.appendChild(linksDiv);
            li.appendChild(meta);
            list.appendChild(li);
          });
        })
        .catch(err => {
          const list = document.getElementById('repo-list');
          list.innerHTML = '';
          list.appendChild(el('li', {}, 'Failed to load repos: ' + err.message));
        });
    })();
  </script>
