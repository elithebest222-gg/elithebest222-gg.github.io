<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWF SmackDown (USA) – PS1 Emulator</title>
  <style>
    html, body {
      margin: 0;
      background: #000;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* This is where the emulator draws the game */
    #game {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- ✅ THIS IS THE DIV -->
  <div id="game"></div>

  <script type="text/javascript">
    // EmulatorJS configuration
    EJS_player = '#game'; // ← this tells the emulator to draw inside that div
    EJS_biosUrl = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/bios/scph5501.bin';
    EJS_gameUrl = 'https://archive.org/download/wwf-smack-down-usa/WWF-SmackDown-USA.cue';
    EJS_core = 'psx';
    EJS_pathtodata = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/';
  </script>
  <script src="https://www.emulatorjs.com/loader.js"></script>

</body>
</html>
