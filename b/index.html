<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
  <title>Balatro</title>

  <!-- Style -->
  <link rel="stylesheet" type="text/css" href="theme/love.css">
  <script src="consolewrapper.js"></script>
</head>

<body>
  <center>
    <div>
      <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas>
      <canvas id="canvas" oncontextmenu="event.preventDefault()" style="display:block;"></canvas>
    </div>
  </center>

  <script src="love.js"></script>
  <script>
    // Resize the canvas to fit the window
    const loadingCanvas = document.getElementById("loadingCanvas");
    loadingCanvas.width = window.innerWidth;
    loadingCanvas.height = window.innerHeight;

    function drawLoadingText(text) {
      const ctx = loadingCanvas.getContext('2d');
      ctx.fillStyle = "rgb(142, 195, 227)";
      ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      ctx.font = '2em Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = "rgb(11, 86, 117)";
      ctx.fillText(text, ctx.canvas.width / 2, ctx.canvas.height / 2);
    }

    // Set up the Love2D Module
    var Module = {
      arguments: ["./game.love"], // 👈 loads your game.love directly
      canvas: document.getElementById('canvas'),
      setStatus: function (text) {
        if (text) {
          drawLoadingText(text);
        } else {
          document.getElementById('loadingCanvas').style.display = 'none';
          document.getElementById('canvas').style.visibility = 'visible';
        }
      }
    };

    // Handle fullscreen resizing
    function FullScreenHook() {
      const canvas = document.getElementById("canvas");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.onresize = FullScreenHook;

    // Prevent arrow keys from scrolling the page
    window.addEventListener("keydown", function (e) {
      if ([32, 37, 38, 39, 40].includes(e.keyCode)) {
        e.preventDefault();
      }
    }, false);

    // Run the game
    window.onload = function () {
      Love(Module);
    };
  </script>

  <!-- Optional footer -->
  <!--
  <footer>
    <p>Built with <a href="https://github.com/Davidobot/love.js">love.js</a></p>
  </footer>
  -->
</body>
</html>
