<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bullet Force (GitHub-Hosted Build)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
    }
    #loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>
  <div id="loading-bar">Loading...</div>

  <!-- Loader stays local or also hosted -->
  <script src="https://github.com/elithebest222-gg/file-1/releases/download/v1.0/bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js"></script>
  <script>
    const config = {
      dataUrl: "https://github.com/elithebest222-gg/file-1/releases/download/v1.0/f72f7d5ca3a89346200595e31da16fd6.data.gz",
      frameworkUrl: "https://github.com/elithebest222-gg/file-1/releases/download/v1.0/36a9b20ec6b448faa8c1c741efc5a796.framework.js.gz",
      codeUrl: "https://github.com/elithebest222-gg/file-1/releases/download/v1.0/245b66f23e9423a6ab35f5dc527fa654.wasm.gz",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Unity",
      productName: "Bullet Force",
      productVersion: "1.0",
      showBanner: (msg, type) => console.log(`${type}: ${msg}`)
    };

    const canvas = document.getElementById("unity-canvas");
    createUnityInstance(canvas, config, (progress) => {
      document.getElementById("loading-bar").textContent = `Loading... ${Math.round(progress * 100)}%`;
    }).then((unityInstance) => {
      document.getElementById("loading-bar").style.display = "none";
    }).catch((message) => {
      alert("Failed to load the game: " + message);
    });
  </script>
</body>
</html>
