<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GN-MATH AI Chatbot</title>
<style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
    h1 { margin-top: 20px; }
    #chat { width: 90%; max-width: 600px; height: 400px; background: #fff; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    #userInput { width: 80%; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; }
    p { margin: 5px 0; }
    b { color: #333; }
</style>
</head>
<body>

<h1>GN-MATH AI Chatbot</h1>
<div id="chat"></div>
<input type="text" id="userInput" placeholder="Type your message">
<button onclick="sendMessage()">Send</button>

<script>
async function sendMessage() {
    const input = document.getElementById("userInput").value.trim();
    if (!input) return;

    const chatDiv = document.getElementById("chat");
    chatDiv.innerHTML += `<p><b>You:</b> ${input}</p>`;
    chatDiv.scrollTop = chatDiv.scrollHeight;

    document.getElementById("userInput").value = "";

    // Call OpenAI API
    try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "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" // <- Replace with your API key
            },
            body: JSON.stringify({
                model: "gpt-3.5-turbo",
                messages: [{ role: "user", content: input }]
            })
        });

        const data = await response.json();
        const botReply = data.choices[0].message.content;

        chatDiv.innerHTML += `<p><b>AI:</b> ${botReply}</p>`;
        chatDiv.scrollTop = chatDiv.scrollHeight;
    } catch (error) {
        chatDiv.innerHTML += `<p style="color:red;"><b>Error:</b> ${error.message}</p>`;
    }
}
</script>

</body>
</html>
